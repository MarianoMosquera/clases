:root{--bg:#0c1228;--fg:#f5f7ff;--muted:#aab7d5;--glass:#17203a;--stroke:#ffffff24}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 10% 5%,#253a69 0,transparent 40%),radial-gradient(ellipse at 95% 45%,#2c1c57 0,transparent 45%),var(--bg);color:var(--fg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#ffffff16 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(#0006,transparent 75%)}.shell{max-width:1160px;margin:auto;padding:50px 24px 100px;position:relative}.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#a8bdfd;font-weight:800}h1{font-size:clamp(32px,5.3vw,66px);letter-spacing:-.055em;line-height:1.06;margin:18px 0 24px;max-width:1000px;background:linear-gradient(100deg,#fff,#a5e5ff 58%,#d9b7ff);color:transparent;background-clip:text}.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:30px 0 34px}.search{background:#ffffff12;border:1px solid #ffffff30;border-radius:16px;padding:15px 18px;color:white;font:inherit;flex:1;min-width:210px;outline:none}.search:focus{border-color:#70c9ff;box-shadow:0 0 0 3px #70c9ff30}button{cursor:pointer;font:inherit}.action{color:#f8faff;border:1px solid #ffffff30;background:#ffffff12;border-radius:14px;padding:14px 16px;transition:.2s}.action:hover{background:#ffffff25;transform:translateY(-2px)}.years{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:40px}.year{border:1px solid #ffffff2a;border-radius:999px;padding:10px 18px;background:#ffffff0c;color:#cbd5f4;font-weight:700}.year.active,.year:hover{background:#a6dfff;color:#0d1b39;border-color:#a6dfff}.timeline{position:relative}.timeline:before{content:"";position:absolute;top:10px;bottom:20px;left:27px;width:3px;background:linear-gradient(#48d5e9,#a986ff,#ffad69,#54dbac);border-radius:8px}.event{position:relative;padding-left:74px;margin-bottom:23px;animation:rise .5s both}.dot{position:absolute;left:15px;top:29px;width:27px;height:27px;border:5px solid var(--bg);border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--accent),0 0 22px var(--accent)}.panel{background:linear-gradient(125deg,#ffffff14,#ffffff08);border:1px solid var(--stroke);border-radius:23px;overflow:hidden;box-shadow:0 18px 60px #0002;backdrop-filter:blur(12px);transition:transform .25s,border-color .25s}.panel:hover{transform:translateX(5px);border-color:var(--accent)}.head{width:100%;background:transparent;border:0;color:inherit;text-align:left;padding:24px 26px;display:flex;align-items:center;gap:20px}.num{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--accent);white-space:nowrap}.heading{font-size:clamp(18px,2.4vw,25px);font-weight:800;letter-spacing:-.025em;flex:1}.chev{font-size:23px;color:var(--accent);transition:transform .25s}.event.open .chev{transform:rotate(180deg)}.content{padding:0 26px 25px;display:none}.event.open .content{display:block;animation:fade .35s}.line{line-height:1.75;color:#dce5fa;font-size:15.5px;margin:10px 0;white-space:pre-wrap;overflow-wrap:anywhere}.line:first-child{font-size:17px;color:white;font-weight:600}.line.bullet{padding:13px 17px;border-left:3px solid var(--accent);background:#ffffff0b;border-radius:0 12px 12px 0}.line a{color:#8ee8ff}.empty{padding:35px;color:#d9e6ff;text-align:center}.footer{margin-top:40px;color:#aebddc;font-size:12px}.hidden{display:none!important}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.shell{padding:34px 14px 70px}.timeline:before{left:13px}.event{padding-left:38px}.dot{left:3px;width:23px;height:23px}.head{padding:20px 15px;gap:10px}.content{padding:0 15px 18px}.num{display:none}.line{font-size:14px}}

const title="Integridad científica en Perú | Línea de tiempo";const data=[{"heading": "2019 · RP 192-2019-CONCYTEC-P", "body": ["Código Nacional de la Integridad Científica.", "• Comité de Integridad Científica (CIC) de CONCYTEC: concentraba la evaluación de infracciones y la intervención sancionadora; el modelo no diferenciaba claramente instrucción y decisión.", "• Código derogado por RP 028-2024."], "year": "2019"}, {"heading": "2021 · Ley 31250", "body": ["Crea y organiza el Sistema Nacional de Ciencia, Tecnología e Innovación (SINACTI); CONCYTEC, ente rector.", "• Principios: ética y excelencia; equidad y transparencia en el acceso, asignación, utilización y evaluación de recursos.", "• Potestad sancionadora de CONCYTEC → faltas a la ética en investigación: negativa injustificada a rendir cuentas de subvenciones; falsificación y plagio; documentación falsa; incumplimiento de confidencialidad."], "year": "2021"}, {"heading": "2023 Escándalo de las granjas de publicaciones científicas", "body": ["29 de octubre de 2023. El programa periodístico Punto Final difundió una investigación sobre la denominada «granja de científicos bamba», que reveló presuntas redes de compraventa de autorías y publicaciones científicas en Perú.", "30 de octubre de 2023. El Consejo Nacional de Ciencia, Tecnología e Innovación Tecnológica (CONCYTEC) se pronunció públicamente sobre las denuncias de comercialización de autorías científicas y manifestó su rechazo a estas prácticas.", "30 de noviembre de 2023. El Congreso de la República del Perú otorgó facultades investigadoras a la Comisión de Ciencia, Innovación y Tecnología por un plazo de 120 días hábiles para investigar presuntas irregularidades relacionadas con la compra y venta de autorías y publicaciones científicas.", "Una investigación parlamentaria identificó transacciones económicas por aproximadamente 3,05 millones de dólares.", "Referencia: Alhuay-Quispe, J., y Yance-Yupari, V. (2025). The Black Market of Publications in Peru: Paper Mills and Authorship for Sale. Learned Publishing. https://doi.org/10.1002/leap.2014 "], "year": "2023"}, {"heading": "Marzo de 2024 · RP 028-2024-CONCYTEC-P", "body": ["Nuevo Código Nacional de Integridad Científica. Enfoque preventivo: principios y buenas prácticas.", "• Principios: integridad, honestidad, objetividad, imparcialidad, veracidad, justicia, responsabilidad,  transparencia y prevención de conflicto de intereses.", "• Sustituye el Código de 2019; su eficacia se articula con la entrada en vigor del Reglamento del SINACTI."], "year": "2024"}, {"heading": "Abril de 2024 · RP 035-2024-CONCYTEC-P", "body": ["Reforma transitoria del Código de 2019.", "• Oficinas de Integridad Científica (OIC) en instituciones de investigación → promoción de la integridad, recepción de denuncias, investigación de presuntas faltas y actuaciones conforme a normas internas.", "• Disolución del CIC de CONCYTEC 2019 y separación entre instrucción, decisión y apelación."], "year": "2024"}, {"heading": "Junio de 2024 · DS 062-2024-PCM", "body": ["Reglamento de la Ley 31250 (SINACTI).", "• Desarrolla fiscalización y potestad sancionadora; infracciones, sanciones y criterios de graduación; procedimiento administrativo sancionador y registro de sanciones.", "• Diferencia denuncia, órgano instructor, órgano decisor y segunda instancia; concreta la separación funcional del procedimiento."], "year": "2024"}, {"heading": "Julio de 2024 · Ley 32098", "body": ["Incorpora el fraude científico como infracción muy grave.", "• Fraude científico → plagio, fabricación o falsificación; manipulación intencional de métodos, datos, imágenes y resultados; apropiación indebida y autoría ficticia. Posibles agravantes: comercio ilegal de autorías y afiliaciones falsas.", "• Amplía destinatarios de trabajos e información falsa: ente rector y actores públicos o privados (Universidades). Endurece sanciones. El régimen puede alcanzar personas naturales, grupos e instituciones; no se limita al investigador individual."], "year": "2024"}, {"heading": "Febrero de 2026 · Decreto Legislativo 1727", "body": ["Reordena y amplía infracciones; refuerza la dimensión institucional y modifica sanciones.", "• Publicación propia redundante; superposición con obras ajenas sin cita; fabricación/falsificación; autoría sin contribución; afiliación falsa; compra/venta de autorías; presentación fraudulenta; conflictos de interés omitidos; discriminación/abuso de poder; instigación; confidencialidad; rendición y desvío de fondos; otorgamiento irregular de recursos; clasificación indebida de investigadores.", "• Responsabilidad de personas naturales e instituciones según conducta y régimen aplicable. Importante: la vigencia del nuevo art. 34 está diferida hasta la adecuación reglamentaria."], "year": "2026"}];const colors=['#58d8f3','#83e0ba','#ffc47b','#b69bff','#f48cbd','#71baff','#ff9e72','#8fe0a8'];let year='Todos';let query='';const timeline=document.getElementById('timeline');document.getElementById('title').textContent=title;
function linkedText(node,text){const pattern=/(https?:\/\/[^\s]+)/g;let last=0;for(const m of text.matchAll(pattern)){node.append(document.createTextNode(text.slice(last,m.index)));let a=document.createElement('a');a.href=m[0];a.target='_blank';a.rel='noopener noreferrer';a.textContent=m[0];node.append(a);last=m.index+m[0].length}node.append(document.createTextNode(text.slice(last)))}
const cards=data.map((item,i)=>{const el=document.createElement('article');el.className='event open';el.style.setProperty('--accent',colors[i]);el.style.animationDelay=(i*55)+'ms';const dot=document.createElement('div');dot.className='dot';const panel=document.createElement('div');panel.className='panel';const head=document.createElement('button');head.className='head';head.setAttribute('aria-expanded','true');head.innerHTML='<span class="num">'+String(i+1).padStart(2,'0')+'</span><span class="heading"></span><span class="chev" aria-hidden="true">⌄</span>';head.querySelector('.heading').textContent=item.heading;head.onclick=()=>{el.classList.toggle('open');head.setAttribute('aria-expanded',el.classList.contains('open'))};const content=document.createElement('div');content.className='content';item.body.forEach(s=>{const p=document.createElement('p');p.className='line'+(s.trim().startsWith('•')?' bullet':'');linkedText(p,s);content.append(p)});panel.append(head,content);el.append(dot,panel);timeline.append(el);return el});
const years=document.getElementById('years');['Todos',...new Set(data.map(x=>x.year))].forEach(y=>{const b=document.createElement('button');b.className='year';b.textContent=y;b.onclick=()=>{year=y;filter()};years.append(b)});
function filter(){let shown=0;data.forEach((item,i)=>{const ok=(year==='Todos'||item.year===year)&&[item.heading,...item.body].join(' ').toLocaleLowerCase().includes(query);cards[i].classList.toggle('hidden',!ok);if(ok)shown++});[...years.children].forEach(b=>b.classList.toggle('active',b.textContent===year));document.getElementById('empty').classList.toggle('hidden',shown>0)}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value.toLocaleLowerCase().trim();filter()});for(const [id,open] of [['expand',true],['collapse',false]])document.getElementById(id).onclick=()=>cards.forEach(el=>{el.classList.toggle('open',open);el.querySelector('.head').setAttribute('aria-expanded',open)});filter();
