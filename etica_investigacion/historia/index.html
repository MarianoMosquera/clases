<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Evolución de la integridad científica</title><style>
:root{--bg:#0b1020;--paper:#141d30;--ink:#edf2fc;--muted:#aebbd0;--teal:#64ddc4;--amber:#ffc477}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% 0%,#1a2a44 0%,var(--bg) 55%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}header{padding:65px 20px 52px;text-align:center}h1{font-size:clamp(2.1rem,5vw,4.7rem);letter-spacing:-.055em;line-height:1.05;margin:0;font-weight:800}.timeline{max-width:1120px;margin:auto;padding:12px 24px 100px;position:relative}.timeline:before{content:"";position:absolute;top:0;bottom:80px;width:3px;left:50%;transform:translateX(-50%);background:linear-gradient(var(--amber),var(--teal));opacity:.6}.event{width:50%;padding:0 48px 34px 0;position:relative}.event:nth-child(even){margin-left:50%;padding:0 0 34px 48px}.event:before{content:"";position:absolute;right:-8px;top:32px;width:16px;height:16px;border-radius:50%;background:var(--teal);border:4px solid var(--bg);box-shadow:0 0 0 2px var(--teal)}.event:nth-child(even):before{right:auto;left:-8px}.event.case:before{background:var(--amber);box-shadow:0 0 0 2px var(--amber)}.card{background:linear-gradient(145deg,#1a2840,#101827);border:1px solid #314057;border-radius:22px;overflow:hidden;box-shadow:0 14px 36px #0004;transition:transform .25s,border-color .25s}.card:hover{transform:translateY(-4px);border-color:#6884a5}.photo{width:100%;height:265px;object-fit:cover;display:block;background:#243149;filter:contrast(1.05)}.inner{padding:25px 27px 28px}.eyebrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.year{font-size:1.05rem;font-weight:800;letter-spacing:.07em;color:var(--teal)}.case .year{color:var(--amber)}.type{font-size:.66rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border:1px solid #46556b;border-radius:99px;padding:6px 9px}h2{font-size:clamp(1.25rem,2vw,1.6rem);line-height:1.2;margin:0 0 13px;letter-spacing:-.025em}p{font-size:.97rem;line-height:1.68;color:#c6d2e4;margin:0}.expand{border:0;background:transparent;color:var(--teal);padding:15px 0 0;font-weight:700;font-size:.9rem;cursor:pointer}.case .expand{color:var(--amber)}.details{display:none;border-top:1px solid #36455d;margin-top:16px;padding-top:16px}.details.open{display:block}.details p{margin-bottom:9px}.details p:last-child{margin-bottom:0}.photo-note{font-size:.72rem;color:#aebbd0;padding:7px 12px;background:#0b1020;line-height:1.4}.reveal{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}@media(max-width:760px){header{padding:45px 18px 38px}.timeline{padding:0 15px 65px}.timeline:before{left:25px}.event,.event:nth-child(even){width:100%;margin-left:0;padding:0 0 22px 34px}.event:before,.event:nth-child(even):before{left:3px;right:auto}.photo{height:230px}.inner{padding:20px}.card{border-radius:17px}}
</style></head><body><header><h1>Evolución de la integridad científica</h1></header><main class="timeline" id="timeline"></main><script>
const data=[
{year:'1946–1947',type:'case',title:'Juicio de los Médicos de Núremberg',description:'Procesamiento de 23 médicos y administradores nazis por experimentos realizados en prisioneros sin consentimiento, que provocaron sufrimiento, lesiones y muertes. Sus conclusiones dieron origen al Código de Núremberg.',image:'https://www.meduniwien.ac.at/web/fileadmin/_processed_/3/a/csm_cover_a5c316c885.jpg',alt:'Fotografía histórica del Juicio de los Médicos de Núremberg'},
{year:'1947',type:'norm',title:'Código de Núremberg',description:'Primer gran referente de la ética de la experimentación humana.',points:['Consentimiento voluntario del participante.','Evaluación proporcional de riesgos y beneficios.','Prevención del sufrimiento innecesario.','Libertad para retirarse del experimento.']},
{year:'1964',type:'norm',title:'Declaración de Helsinki',description:'La Asociación Médica Mundial establece principios éticos para la investigación médica con participantes humanos.',points:['Consentimiento informado.','Evaluación independiente por comités de ética.','Protección de participantes vulnerables.','Primacía de los derechos de los participantes.']},
{year:'1966',type:'case',title:'Escándalo de Willowbrook',description:'Durante las décadas de 1950 a 1970, niños con discapacidad intelectual institucionalizados fueron expuestos deliberadamente al virus de la hepatitis. El caso cuestionó el consentimiento y la protección de poblaciones vulnerables.',image:'https://s3.amazonaws.com/cdn.bunkhistory.org/derivatives/og/images/2024-11-08/%242y%2410%24f4JHDJGPSjEnxhdvdWvLWuGVGawXOrn7UmR3DVyonq7o0fmomqOq/elliott1_1-112124-900.jpg',alt:'Imagen histórica de una sala infantil institucional, asociada a un artículo sobre Willowbrook'},
{year:'1972',type:'case',title:'Escándalo de Tuskegee',description:'Un estudio iniciado en 1932 observó la sífilis en hombres afroamericanos sin informarles adecuadamente ni ofrecerles tratamiento eficaz, incluso cuando ya existía la penicilina. El escándalo se hizo público en 1972.',image:'https://res.cloudinary.com/aenetworks/image/upload/c_fill%2Cw_3840%2Ch_2509%2Cg_auto/dpr_auto/f_auto/q_auto%3Aeco/v1/tuskegee-syphilis-study-18862_001_a',alt:'Fotografía histórica del estudio de sífilis de Tuskegee'},
{year:'1979',type:'norm',title:'Informe Belmont',description:'Consolida el marco principialista de la ética de investigación en seres humanos.',points:['Respeto por las personas y su autonomía.','Beneficencia: maximizar beneficios y reducir daños.','Justicia en la distribución de cargas y beneficios.']},
{year:'1982',type:'norm',title:'Pautas CIOMS/OMS',description:'Orientaciones internacionales que traducen los principios bioéticos en criterios prácticos para la investigación biomédica; revisadas posteriormente.',points:['Validez científica.','Consentimiento informado.','Justicia distributiva.','Protección de poblaciones vulnerables.']},
{year:'2005',type:'norm',title:'Declaración Universal sobre Bioética y Derechos Humanos',description:'La UNESCO vincula la bioética con los derechos humanos y la responsabilidad social.',points:['Dignidad humana y autonomía.','Igualdad y no discriminación.','Responsabilidad social.','Protección de generaciones futuras.']},
{year:'2005–2006',type:'case',title:'Fraude científico de Hwang Woo-suk',description:'Se descubrió la falsificación de resultados publicados sobre clonación y células madre humanas. El escándalo evidenció problemas de fabricación de datos, supervisión, autoría y consentimiento en la obtención de óvulos.',image:'https://media.gettyimages.com/id/56578307/photo/hwang-woo-suk-press-conference.jpg?s=2048x2048&w=gi&k=20&c=0',alt:'Hwang Woo-suk durante una comparecencia pública en 2006'},
{year:'2010',type:'norm',title:'Declaración de Singapur sobre Integridad en la Investigación',description:'Consolida principios de integridad aplicables a todas las disciplinas científicas, más allá de los estudios con participantes humanos.',points:['Honestidad: veracidad en la investigación.','Responsabilidad: responder por la integridad del trabajo.','Cortesía profesional y equidad: respeto y reconocimiento justo.','Buena administración: gestión responsable de la investigación.']}
];
const root=document.querySelector('#timeline');data.forEach((d,i)=>{let el=document.createElement('article');el.className='event '+(d.type==='case'?'case':'norm');let details=d.points?`<div class="details" id="d${i}">${d.points.map(x=>`<p>• ${x}</p>`).join('')}</div><button class="expand" aria-expanded="false" aria-controls="d${i}">Ver principios +</button>`:'';el.innerHTML=`<div class="card">${d.image?`<img class="photo" src="${d.image}" alt="${d.alt}" loading="${i===0?'eager':'lazy'}" referrerpolicy="no-referrer">`:''}<div class="inner"><div class="eyebrow"><span class="year">${d.year}</span><span class="type">${d.type==='case'?'Caso histórico':'Instrumento'}</span></div><h2>${d.title}</h2><p>${d.description}</p>${details}</div></div>`;root.appendChild(el)});document.querySelectorAll('.expand').forEach(b=>b.addEventListener('click',()=>{let d=document.getElementById(b.getAttribute('aria-controls'));let open=d.classList.toggle('open');b.setAttribute('aria-expanded',String(open));b.textContent=open?'Ocultar principios −':'Ver principios +';if(open)d.classList.add('reveal')}));
</script></body></html>
