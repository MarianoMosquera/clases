{year:'2010',type:'norm',title:'Declaración de Singapur sobre Integridad en la Investigación',description:'Consolida principios de integridad aplicables a todas las disciplinas científicas, más allá de los estudios con participantes humanos.',points:['Honestidad: veracidad en la investigación.','Responsabilidad: responder por la integridad del trabajo.','Cortesía profesional y equidad: respeto y reconocimiento justo.','Buena administración: gestión responsable de la investigación.']}
];
const root=document.querySelector('#timeline');data.forEach((d,i)=>{let el=document.createElement('article');el.className='event '+(d.type==='case'?'case':'norm');let details=d.points?`<div class="details" id="d${i}">${d.points.map(x=>`<p>• ${x}</p>`).join('')}</div><button class="expand" aria-expanded="false" aria-controls="d${i}">Ver principios +</button>`:'';el.innerHTML=`<div class="card">${d.image?`<img class="photo" src="${d.image}" alt="${d.alt}" loading="${i===0?'eager':'lazy'}" referrerpolicy="no-referrer">`:''}<div class="inner"><div class="eyebrow"><span class="year">${d.year}</span><span class="type">${d.type==='case'?'Caso histórico':'Instrumento'}</span></div><h2>${d.title}</h2><p>${d.description}</p>${details}</div></div>`;root.appendChild(el)});document.querySelectorAll('.expand').forEach(b=>b.addEventListener('click',()=>{let d=document.getElementById(b.getAttribute('aria-controls'));let open=d.classList.toggle('open');b.setAttribute('aria-expanded',String(open));b.textContent=open?'Ocultar principios −':'Ver principios +';if(open)d.classList.add('reveal')}));
